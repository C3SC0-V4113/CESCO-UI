name: Registry Install

# Builds the registry and installs every item into a fresh shadcn app for each
# base and icon library, then type-checks what the user would receive.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs of the same branch or PR to save Actions minutes.
concurrency:
  group: registry-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: install (${{ matrix.base }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        base: [base, radix, aria]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build registry
        run: npm run registry:build

      - name: Install into a fresh ${{ matrix.base }} app
        run: npm run test:registry-install -- ${{ matrix.base }}
